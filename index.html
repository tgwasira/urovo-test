<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>K329 Print Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }

    button {
      font-size: 18px;
      padding: 14px 20px;
      margin-bottom: 20px;
    }

    /*
     * Physical label canvas stays 50 x 30 mm.
     */
    #label {
      width: 50mm;
      height: 30mm;

      position: relative;
      overflow: hidden;

      background: white;
      border: 1px solid #aaa;
    }

    /*
     * But the actual content is deliberately small.
     */
    .content {
      position: absolute;

      left: 2mm;
      top: 2mm;

      font-size: 8px;
      line-height: 1.2;

      color: black;
    }

    .title {
      font-size: 10px;
      font-weight: bold;
    }

    .small {
      font-size: 7px;
    }

    @media print {

      @page {
        size: 50mm 30mm;
        margin: 0;
      }

      html,
      body {
        width: 50mm;
        height: 30mm;

        margin: 0 !important;
        padding: 0 !important;

        background: white;
      }

      body * {
        visibility: hidden;
      }

      #label,
      #label * {
        visibility: visible;
      }

      #label {
        position: absolute;

        left: 0;
        top: 0;

        width: 50mm;
        height: 30mm;

        margin: 0;
        padding: 0;

        border: none;
      }
    }
  </style>
</head>

<body>

  <button onclick="window.print()">
    Print Test Label
  </button>

  <div id="label">

    <div class="content">

      <div class="title">
        TEST 123
      </div>

      <div>
        John Smith
      </div>

      <div class="small">
        K329 TEST
      </div>

    </div>

  </div>

</body>
</html>
