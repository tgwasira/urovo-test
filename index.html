<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>K329 Print Test</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .label {
      width: 50mm;
      height: 30mm;
      border: 1px solid #ccc;
      padding: 3mm;
      box-sizing: border-box;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    @media print {
      body {
        margin: 0;
        padding: 0;
      }

      button {
        display: none;
      }

      .label {
        border: none;
      }

      @page {
        size: 50mm 30mm;
        margin: 0;
      }
    }
  </style>
</head>

<body>

  <button onclick="window.print()">
    Print K329 Test
  </button>

  <br><br>

  <div class="label">
    <div class="title">HELLO K329</div>
    <div>Printed from Chrome</div>
    <div>123456789</div>
  </div>

</body>
</html>
